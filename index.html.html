<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vampire Survival 2D Mobile & Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
        }
        canvas {
            background-color: #1a2417;
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
        }
        .hud-element {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            color: #ff3333;
            font-size: 36px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 18px;
            margin-bottom: 20px;
            color: #cccccc;
            text-align: center;
            padding: 0 10px;
        }
        button {
            background: #e63946;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: #d62839;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        /* Mobile Joystick Base Overlay */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            touch-action: none;
            z-index: 6;
        }
        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: rgba(230, 57, 70, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui-overlay">
            <div class="hud-element" id="hp-display">Can: 100 / 100</div>
            <div class="hud-element" id="score-display">Skor: 0</div>
            <div class="hud-element" id="timer-display">Süre: 00:00</div>
        </div>

        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <div id="game-over-screen">
            <h1>OYUN BİTTİ</h1>
            <p id="final-stats">Hayatta Kalma Süresi: 00:00 | Skor: 0</p>
            <button onclick="restartGame()">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI References
        const hpDisplay = document.getElementById('hp-display');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalStats = document.getElementById('final-stats');
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');

        // Web Audio Synthesizer Sound Effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'attack') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'player_damage') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {}
        }

        // Keyboard State
        const keys = {};
        window.addEventListener('keydown', e => {
            initAudio();
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Touch Joystick Logic
        let touchMoveDir = { x: 0, y: 0 };
        let joystickActive = false;
        let joystickTouchId = null;
        let joystickCenter = { x: 0, y: 0 };

        const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        if (isTouchDevice) {
            joystickBase.style.display = 'block';
        }

        window.addEventListener('touchstart', e => {
            initAudio();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.clientX < window.innerWidth / 2 && !joystickActive) {
                    joystickActive = true;
                    joystickTouchId = touch.identifier;
                    
                    joystickBase.style.left = `${touch.clientX - 50}px`;
                    joystickBase.style.top = `${touch.clientY - 50}px`;
                    joystickBase.style.display = 'block';

                    joystickCenter = { x: touch.clientX, y: touch.clientY };
                    joystickStick.style.transform = `translate(-50%, -50%)`;
                }
            }
        });

        window.addEventListener('touchmove', e => {
            if (!joystickActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    const dx = touch.clientX - joystickCenter.x;
                    const dy = touch.clientY - joystickCenter.y;
                    const dist = Math.hypot(dx, dy);
                    const maxDist = 40;

                    const angle = Math.atan2(dy, dx);
                    const clampedDist = Math.min(dist, maxDist);

                    const stickX = Math.cos(angle) * clampedDist;
                    const stickY = Math.sin(angle) * clampedDist;

                    joystickStick.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;

                    touchMoveDir.x = dist > 5 ? Math.cos(angle) : 0;
                    touchMoveDir.y = dist > 5 ? Math.sin(angle) : 0;
                }
            }
        });

        const resetJoystick = () => {
            joystickActive = false;
            joystickTouchId = null;
            touchMoveDir = { x: 0, y: 0 };
            joystickStick.style.transform = `translate(-50%, -50%)`;
            if (!isTouchDevice) joystickBase.style.display = 'none';
        };

        window.addEventListener('touchend', e => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    resetJoystick();
                }
            }
        });
        window.addEventListener('touchcancel', resetJoystick);

        // Game Entities & State
        let isGameOver = false;
        let score = 0;
        let gameTime = 0;
        let lastTime = performance.now();
        let spawnTimer = 0;

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 14,
            speed: 200,
            maxHp: 100,
            hp: 100,
            attackRadius: 110,
            attackCooldown: 0.5,
            attackTimer: 0,
            damageSoundCooldown: 0
        };

        let enemies = [];
        let particles = [];
        let attackRings = [];

        class Enemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.speed = 70 + Math.random() * 40;
                this.hp = 3;
                this.hitFlash = 0;
            }

            update(dt) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    this.x += (dx / dist) * this.speed * dt;
                    this.y += (dy / dist) * this.speed * dt;
                }

                if (dist < this.radius + player.radius) {
                    player.hp -= 20 * dt;
                    if (player.damageSoundCooldown <= 0) {
                        playSound('player_damage');
                        player.damageSoundCooldown = 0.3;
                    }
                    if (player.hp < 0) player.hp = 0;
                }

                if (this.hitFlash > 0) this.hitFlash -= dt * 5;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#2e8b57';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#1e5631';
                ctx.stroke();

                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(this.x - 4, this.y - 3, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 4, this.y - 3, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 2;
                this.vx = (Math.random() - 0.5) * 160;
                this.vy = (Math.random() - 0.5) * 160;
                this.life = 0.3;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life / 0.3);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnEnemy() {
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -20 : canvas.width + 20;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -20 : canvas.height + 20;
            }
            enemies.push(new Enemy(x, y));
        }

        function performAttack() {
            let hitAny = false;
            attackRings.push({ x: player.x, y: player.y, radius: 10, maxRadius: player.attackRadius, alpha: 1 });
            
            enemies.forEach(enemy => {
                const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (dist <= player.attackRadius + enemy.radius) {
                    enemy.hp -= 1;
                    enemy.hitFlash = 1;
                    hitAny = true;

                    for (let i = 0; i < 4; i++) {
                        particles.push(new Particle(enemy.x, enemy.y, '#e63946'));
                    }
                }
            });

            playSound('attack');
            if (hitAny) playSound('hit');
        }

        function update(dt) {
            if (isGameOver) return;

            gameTime += dt;
            spawnTimer += dt;
            if (player.damageSoundCooldown > 0) player.damageSoundCooldown -= dt;

            const currentSpawnRate = Math.max(0.15, 1.0 - Math.floor(gameTime / 12) * 0.12);
            if (spawnTimer >= currentSpawnRate) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // Controls Movement
            let dx = touchMoveDir.x;
            let dy = touchMoveDir.y;

            if (dx === 0 && dy === 0) {
                if (keys['w'] || keys['arrowup']) dy -= 1;
                if (keys['s'] || keys['arrowdown']) dy += 1;
                if (keys['a'] || keys['arrowleft']) dx -= 1;
                if (keys['d'] || keys['arrowright']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }
            }

            player.x += dx * player.speed * dt;
            player.y += dy * player.speed * dt;

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Auto Attack
            player.attackTimer += dt;
            if (player.attackTimer >= player.attackCooldown) {
                performAttack();
                player.attackTimer = 0;
            }

            // Enemies Update
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.update(dt);

                if (enemy.hp <= 0) {
                    for (let p = 0; p < 6; p++) {
                        particles.push(new Particle(enemy.x, enemy.y, '#2e8b57'));
                    }
                    enemies.splice(i, 1);
                    score += 10;
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Ring FX
            for (let i = attackRings.length - 1; i >= 0; i--) {
                const ring = attackRings[i];
                ring.radius += (ring.maxRadius - ring.radius) * 15 * dt;
                ring.alpha -= 3 * dt;
                if (ring.alpha <= 0) attackRings.splice(i, 1);
            }

            // UI Text
            hpDisplay.innerText = `Can: ${Math.ceil(player.hp)} / ${player.maxHp}`;
            scoreDisplay.innerText = `Skor: ${score}`;
            const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
            const secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `Süre: ${mins}:${secs}`;

            if (player.hp <= 0) {
                isGameOver = true;
                finalStats.innerText = `Hayatta Kalma Süresi: ${mins}:${secs} | Skor: ${score}`;
                gameOverScreen.classList.add('active');
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid BG
            ctx.strokeStyle = '#22301e';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Rings FX
            attackRings.forEach(ring => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(230, 57, 70, ${Math.max(0, ring.alpha)})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            });

            particles.forEach(p => p.draw());
            enemies.forEach(e => e.draw());

            // Player Draw
            if (!isGameOver) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 4, 0, Math.PI * 2);
                ctx.fillStyle = '#4a0e17';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#e63946';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(player.x - 4, player.y - 2, 2, 0, Math.PI * 2);
                ctx.arc(player.x + 4, player.y - 2, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(loop);
        }

        function restartGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.hp = player.maxHp;
            player.attackTimer = 0;
            enemies = [];
            particles = [];
            attackRings = [];
            score = 0;
            gameTime = 0;
            spawnTimer = 0;
            isGameOver = false;
            gameOverScreen.classList.remove('active');
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
